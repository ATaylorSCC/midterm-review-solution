<header class="app-header">
  <h1>{{ title }}</h1>

  <!-- NAVIGATION: routerLink changes pages without a full browser reload. -->
  <nav>
    <a routerLink="/trails" routerLinkActive="active">Trails</a>
    |
    <a routerLink="/about" routerLinkActive="active">About</a>
  </nav>

  <button type="button" (click)="toggleStats()">
    {{ showStats() ? 'Hide stats' : 'Show stats' }}
  </button>
</header>

<main class="app-main">
  <div class="layout">

    <!-- ROUTER OUTLET: Angular displays the matching page here. -->
    <router-outlet />

    <aside class="side">
      @if (showStats()) {
        <app-stats-panel />
      }
    </aside>

  </div>

  <section class="packs">
    <app-pack-list label="Day pack" />
    <app-pack-list label="Overnight pack" />
  </section>
</main>
